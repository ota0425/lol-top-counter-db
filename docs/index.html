","detail":"強化Wで壊されるシールドを先に使わない。Wを使わせてから防御手段を使うタイミングを考える。"}]},{"name":"レンガー","aliases":["Rengar"],"tips":[{"category":"アイテム","detail":"動画ではウェーブを押し付ける方針と、回復を抑える重傷アイテムを対策として挙げている。"},{"category":"基本対策","detail":"ブッシュからの飛びかかりが届かない位置でファームする。安全に過ごしたい時間にブッシュ際へ近寄らない。"},{"category":"トレード","detail":"戦う場面では距離を空け続けず、動画では密着して飛びかかりを繰り返されにくくする方法を示している。"},{"category":"注意点","detail":"フェロシティが最大の相手へ仕掛けない。強化スキルが使えるかを見て交換を決める。"}]},{"name":"ワーウィック","aliases":["Warwick","ワーウィック"],"tips":[{"category":"基本対策","detail":"自分の体力を高く保つ方針が動画で示されている。削られたまま無理にCSや交換を狙わない。"},{"category":"アイテム","detail":"回復を抑える手段を早めに用意する。動画では勝負するならイグナイト、自分から付与できる重傷装備を優先候補にしている。"},{"category":"トレード","detail":"短く攻撃してすぐ撤退する。長い殴り合いを避け、リーサルテンポ等の効果が溜まったら切れるまで近寄らない。"},{"category":"注意点","detail":"瀕死の相手ほど回復を警戒する。低体力にしただけで倒せると思わず、追撃で逆転されないようにする。"}]}]</script>
<script>
'use strict';
const champions=JSON.parse(document.getElementById('counter-data').textContent);
const search=document.getElementById('search');
const grid=document.getElementById('champion-grid');
const results=document.getElementById('results');
const clear=document.getElementById('clear');
const reset=document.getElementById('reset');
const empty=document.getElementById('empty');
function key(value){return value.normalize('NFKC').toLowerCase().replace(/[ァ-ヶ]/g,c=>String.fromCharCode(c.charCodeAt(0)-0x60)).replace(/[\s・･.\-ー＝='’]/g,'');}
function matches(value,champion){return [champion.name,...champion.aliases].some(alias=>key(alias).includes(key(value)));}
function selectChampion(name){search.value=name;render();search.focus();updateURL();}
function updateURL(){const url=new URL(location.href);if(search.value.trim())url.searchParams.set('champion',search.value.trim());else url.searchParams.delete('champion');history.replaceState(null,'',url);}
function render(){
 const query=search.value.trim();
 const found=champions.filter(champion=>matches(query,champion));
 document.getElementById('result-count').textContent=query?`${found.length}チャンピオンが一致`:'チャンピオン一覧';
 grid.replaceChildren();results.replaceChildren();empty.hidden=found.length>0;
 clear.hidden=!search.value;reset.hidden=!search.value;
 if(!query){
  for(const champion of found){const button=document.createElement('button');button.type='button';button.className='champion';const name=document.createElement('span');name.textContent=champion.name;const count=document.createElement('small');count.textContent=`${champion.tips.length}件`;button.append(name,count);button.addEventListener('click',()=>selectChampion(champion.name));grid.append(button);}
 }else{
  for(const champion of found){const details=document.createElement('details');details.className='counter';details.open=found.length===1;const summary=document.createElement('summary');summary.append(document.createTextNode(champion.name));const count=document.createElement('small');count.textContent=`${champion.tips.length}件の対策`;summary.append(count);details.append(summary);const tips=document.createElement('div');tips.className='tips';for(const tip of champion.tips){const block=document.createElement('div');block.className='tip';const label=document.createElement('span');label.className='category';label.textContent=tip.category;const body=document.createElement('p');body.textContent=tip.detail;block.append(label,body);tips.append(block);}details.append(tips);results.append(details);}
 }
}
function clearSearch(){search.value='';render();updateURL();search.focus();}
search.addEventListener('input',()=>{render();updateURL();});search.addEventListener('keydown',event=>{if(event.key==='Escape')clearSearch();});clear.addEventListener('click',clearSearch);reset.addEventListener('click',clearSearch);
document.getElementById('champion-count').textContent=champions.length;document.getElementById('tip-count').textContent=champions.reduce((total,champion)=>total+champion.tips.length,0);search.value=new URL(location.href).searchParams.get('champion')||'';render();
</script>
