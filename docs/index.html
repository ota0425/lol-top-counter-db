ound:var(--paper);border:1px solid var(--line);border-radius:12px;margin-bottom:14px;overflow:hidden}.counter summary{font-size:18px;font-weight:700;cursor:pointer;padding:18px 20px}.counter summary:hover{background:#fafbfe}.counter summary small{font-size:12px;font-weight:400;color:var(--muted);margin-left:12px}.tips{padding:0 22px 8px}.tip{border-top:1px solid var(--line);padding:18px 0}.category{display:inline-block;font-size:11px;font-weight:650;line-height:1.6;padding:3px 9px;background:var(--soft);color:var(--accent);border-radius:5px}.tip p{margin:8px 0 0;font-size:15px;line-height:1.95;overflow-wrap:anywhere}.empty{border:1px dashed #cbd5e4;border-radius:12px;padding:35px 20px;text-align:center;color:var(--muted)}.empty strong{display:block;color:var(--ink);font-size:16px}.empty p{font-size:13px;margin:8px 0 0}[hidden]{display:none!important}button:focus-visible,summary:focus-visible{outline:3px solid #245de055;outline-offset:3px}footer{font-size:11px;color:#7b899e;text-align:center;margin-top:40px;letter-spacing:.08em}noscript{display:block;padding:20px;background:var(--paper)}

<script id="counter-data" type="application/json">[{"name":"アーゴット","aliases":["Urgot"],"checklist":["一定方向の位置で戦い続ける","プレスアタックを発動させない","テンプレのソロキル方法を把握しておく","E使用後を叩く","フラッシュ / ワーデンメイル / プレートスチールキャップを採用する"],"supplements":["ルーンはボーンアーマーを候補にする。遠隔チャンピオンだからと息継ぎで固定せず、コンボのバーストへの対策を重視する。","Lv1・Lv6・最初のコアアイテム購入後は特に警戒する。イグナイト持ちには、テレポートとの差を無視して序盤のソロキルを狙わない。"],"tips":[{"category":"基本対策","detail":"周囲を回り込まず、同じ方向から戦う。すでにパッシブを使った脚の側に位置を保ち、複数の脚の追加攻撃を受けない。"},{"category":"トレード","detail":"プレスアタック採用時は通常攻撃を2発受けたら距離やブッシュで追撃を切る。発動を避けられないときはシールドを合わせる。"},{"category":"注意点","detail":"E＋フラッシュからのオールインを警戒する。遠くからEを使って接近してきたら、フラッシュで逃げる判断を早めに行う。"},{"category":"スキル対策","detail":"Eを使わせた後が反撃の機会。シールドと移動手段を失った間に、同じ脚の側を維持して攻撃する。"},{"category":"アイテム","detail":"動画ではフラッシュ、ワーデンメイル、プレートスチールキャップを推奨。相手自身の回復対策としてブランブルベストを優先する必要は薄いと説明している。"}]},{"name":"アカリ","aliases":["Akali"],"checklist":["Q使用後のAAを受けないようにする","Eを大警戒する","気の量で立ち回りを変える","W / E使用後を叩く","範囲攻撃系アイテム / 対APアイテムを採用する"],"supplements":["ドランシールドと息継ぎでQ・通常攻撃の細かいハラスを受け流す。削られた状態でEからのオールインを受けないよう体力を維持する。"],"tips":[{"category":"スキル対策","detail":"Qが当たった後の強化通常攻撃まで受けないよう距離を取る。動画ではQそのものより、パッシブを絡めた追撃への警戒を重視している。"},{"category":"基本対策","detail":"味方ミニオンを盾にしてEの手裏剣を防ぐ。ミニオンから離れた位置で不用意にファームしない。"},{"category":"トレード","detail":"気が少なく、Wの煙幕もない時間に攻める。気が多いときは連続スキルを警戒し、無理に殴り合わない。"},{"category":"注意点","detail":"動画の対策項目ではW・Eを使った後の反撃も挙げている。煙幕や接近手段が残っている状態で追いかけ続けない。"}]},{"name":"アンベッサ","aliases":["Ambessa"],"checklist":["スキル使用後を叩く","適切なタイミングでスキルを合わせる","W使用時 / バリアがある状態は叩かない","フラッシュを採用する","Lv6以降重傷アイテムを採用する"],"supplements":["機動力に靴だけで対抗しようとせず、武器や防具を優先してコアを完成させる方針もある。","対策ピックの候補はレネクトン、カミール、シンジド、ティーモ。特にレネクトンは強化Wでシールドを壊せる点を評価している。"],"tips":[{"category":"トレード","detail":"スキルを一通り使わせた後に反撃する。スキルとダッシュが使えない時間を狙い、相手のショートトレードだけで終わらせない。"},{"category":"スキル対策","detail":"ダッシュを追ってスキルを空振りするより、Qの攻撃にシールドや移動スキルを合わせる。"},{"category":"注意点","detail":"Wで身構えている間やシールドが残っている間は攻撃を控え、シールドが消えてから反撃する。"},{"category":"基本対策","detail":"Rに対応できるようフラッシュを残す。動画ではRを見てから回避する方針を勧めている。"},{"category":"アイテム","detail":"動画ではレベル6以降の回復に対して重傷を推奨している。レベル6前 <script>
'use strict';
const champions=JSON.parse(document.getElementById('counter-data').textContent);
const iconCatalog=JSON.parse(document.getElementById('icon-data').textContent);
const search=document.getElementById('search');
const grid=document.getElementById('champion-grid');
const results=document.getElementById('results');
const clear=document.getElementById('clear');
const reset=document.getElementById('reset');
const empty=document.getElementById('empty');
function key(value){return value.normalize('NFKC').toLowerCase().replace(/[ァ-ヶ]/g,c=>String.fromCharCode(c.charCodeAt(0)-0x60)).replace(/[\s・･.\-ー＝='’]/g,'');}
function matches(value,champion){return [champion.name,...champion.aliases].some(alias=>key(alias).includes(key(value)));}
function iconText(container,text,champion,includeSkills=false){
 const terms={...iconCatalog.terms};
 if(includeSkills){
  const skills=iconCatalog.champions[champion.name]||{};
  Object.assign(terms,skills);
  for(const base of ['Q','W','E','R']){
   if(skills[base])for(const phase of ['1','2','3'])terms[base+phase]=skills[base];
  }
 }
 const names=Object.keys(terms).sort((a,b)=>b.length-a.length);
 let plain='';
 function flush(){if(plain){container.append(document.createTextNode(plain));plain='';}}
 for(let index=0;index<text.length;){
  const name=names.find(term=>{
   if(!text.startsWith(term,index))return false;
   if(/^(?:ULT|[QWER][123]?)$/.test(term)){
    const before=text[index-1]||'';const after=text[index+term.length]||'';
    if(/[A-Za-z]/.test(before)||/[A-Za-z]/.test(after))return false;
   }
   return true;
  });
  if(!name){plain+=text[index++];continue;}
  flush();
  const asset=terms[name];const span=document.createElement('span');span.className='icon-term';span.title=asset.label;
  if(asset.src.includes('/rune-')||asset.src.includes('/stat-'))span.dataset.kind='rune';
  const image=document.createElement('img');image.className='game-icon';image.src=asset.src;image.alt='';image.width=28;image.height=28;image.loading='lazy';image.decoding='async';
  image.addEventListener('error',()=>image.remove(),{once:true});
  span.append(image,document.createTextNode(name));container.append(span);index+=name.length;
 }
 flush();
}
function selectChampion(name){search.value=name;render();search.focus();updateURL();}
function updateURL(){const url=new URL(location.href);if(search.value.trim())url.searchParams.set('champion',search.value.trim());else url.searchParams.delete('champion');history.replaceState(null,'',url);}
function render(){
 const query=search.value.trim();
 const exact=champions.filter(champion=>key(champion.name)===key(query));
 const found=exact.length?exact:champions.filter(champion=>matches(query,champion));
 document.getElementById('result-count').textContent=query?`${found.length}チャンピオンが一致`:'チャンピオン一覧';
 grid.replaceChildren();results.replaceChildren();empty.hidden=found.length>0;
 clear.hidden=!search.value;reset.hidden=!search.value;
 if(!query){
  for(const champion of found){
   const button=document.createElement('button');button.type='button';button.className='champion';
   const name=document.createElement('span');name.textContent=champion.name;
   const count=document.createElement('small');count.textContent=`${champion.checklist.length}項目`;
   button.append(name,count);button.addEventListener('click',()=>selectChampion(champion.name));grid.append(button);
  }
 }else{
  for(const champion of found){
   const details=document.createElement('details');details.className='counter';details.open=found.length===1;
   const summary=document.createElement('summary');summary.append(document.createTextNode(champion.name));
   const count=document.createElement('small');count.textContent=`${champion.checklist.length}項目${champion.supplements.length?' ＋ 追加の対策':''}`;
   summary.append(count);details.append(summary);
   const checklist=document.createElement('ol');checklist.className='checklist';
   for(const text of champion.checklist){const item=document.createElement('li');const content=document.createElement('span');content.className='icon-text';iconText(content,text,champion,true);item.append(content);checklist.append(item);}
   details.append(checklist);
   if(champion.supplements.length){
    const additions=document.createElement('section');additions.className='additions';
    const heading=document.createElement('h3');heading.textContent='追加の対策';additions.append(heading);
    const list=document.createElement('ul');
    for(const text of champion.supplements){const item=document.createElement('li');iconText(item,text,champion);list.append(item);}
    additions.append(list);details.append(additions);
   }
   if(champion.tips.length){
    const more=document.createElement('details');more.className='more';
    const heading=document.createElement('summary');heading.textContent=`詳しい立ち回り・補足（${champion.tips.length}件）`;more.append(heading);
    const tips=document.createElement('div');tips.className='tips';
    for(const tip of champion.tips){
     const block=document.createElement('div');block.className='tip';
     const label=document.createElement('span');label.className='category';label.textContent=tip.category;
     const body=document.createElement('p');iconText(body,tip.detail,champion);block.append(label,body);tips.append(block);
    }
    more.append(tips);details.append(more);
   }
   results.append(details);
  }
 }
}
function clearSearch(){search.value='';render();updateURL();search.focus();}
search.addEventListener('input',()=>{render();updateURL();});search.addEventListener('keydown',event=>{if(event.key==='Escape')clearSearch();});clear.addEventListener('click',clearSearch);reset.addEventListener('click',clearSearch);
document.getElementById('champion-count').textContent=champions.length;document.getElementById('tip-count').textContent=champions.reduce((total,champion)=>total+champion.checklist.length,0);search.value=new URL(location.href).searchParams.get('champion')||'';render();
</script>
